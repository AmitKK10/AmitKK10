name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: AmitKK10
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23ff4fa3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff4fa3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
